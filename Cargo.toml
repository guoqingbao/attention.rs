[package]
name = "attention-rs"
version = "0.6.3"
edition = "2021"
description = "High-performance LLM attention kernels and operations (PagedAttention, Flahinfer, Mamba, MoE, RoPE) for Candle, optimized for CUDA and Metal."
repository = "https://github.com/guoqingbao/attention.rs"
homepage = "https://github.com/guoqingbao/attention.rs"
documentation = "https://docs.rs/attention-rs"
readme = "ReadMe.md"
keywords = ["attention", "mamba", "moe", "flashinfer", "candle", "inference", "rust"]
categories = ["algorithms", "hardware-support", "science"]
license = "MIT"

[dependencies]
candle-core = { git = "https://github.com/EnflameTechnology/candle.git", version = "0.8.3", rev ="9324ecd" }
candle-nn = { git = "https://github.com/EnflameTechnology/candle.git", version = "0.8.3", rev ="9324ecd" }
serde = { version = "1.0.190", features = ["serde_derive"] }
serde_json = "1.0.108"
half = { version = "2.5.0", features = ["num-traits", "use-intrinsics", "rand_distr"] }
tracing = "0.1.40"
parking_lot = "0.12.4"
rayon="1.10.0"
gcu-kernels = {path = "./src/gcu-kernels", version="0.1.6", optional = true}
kernels = { path = "./src/kernels", version="0.6.3", optional = true}
metal = { version = "0.27.0", features = ["mps"], optional = true }
metal-kernels = { path = "./src/metal-kernels", version="0.2.4", optional = true}
ureq = { version = "2.10", optional = true }
sha2 = { version = "0.10", optional = true }

[features]
cuda = ["candle-core/cuda", "candle-nn/cuda", "dep:kernels"]
gcu = ["candle-core/gcu", "candle-core/async", "candle-nn/gcu", "dep:gcu-kernels"]
graph = ["candle-core/graph"]
flashattn = []
no-marlin = ["dep:kernels", "kernels/no-marlin"]
no-fp8-kvcache = ["dep:kernels", "kernels/no-fp8-kvcache"]
metal = ["candle-core/metal", "candle-nn/metal", "dep:metal-kernels", "dep:metal"]
metal-flash = ["metal"]
cutlass = ["dep:kernels", "kernels/cutlass"]
flash = ["cuda", "dep:kernels", "kernels/flash"]
flashinfer = ["cuda", "dep:kernels", "kernels/flashinfer"]
aten = ["candle-core/aten", "candle-nn/aten"]
