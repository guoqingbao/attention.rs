[package]
name = "metal-kernels"
version = "0.1.9"
edition = "2021"
description = "Paged attention kernels for Metal device"
categories = ["science"]
license = "MIT OR Apache-2.0"

[dependencies]
metal = { version = "0.27.0", features = ["mps"] }
thiserror = "1"
once_cell = "1.20.2"

# Upstream candle (default)
candle-core = { version = "0.10", optional = true, default-features = false }
# Custom fork
candle-core-custom = { package = "candle-core", git = "https://github.com/guoqingbao/candle.git", version = "0.8.3", rev = "b63bf40", optional = true, default-features = false }

[features]
default = ["candle-upstream"]
candle-upstream = ["dep:candle-core"]
candle-custom = ["dep:candle-core-custom"]

[build-dependencies]
anyhow = { version = "1", features = ["backtrace"] }
